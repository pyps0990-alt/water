name: Hosting preview

on:
  push:
    branches: [claude/**]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.AUTO_DEPLOY }}
      - uses: ./.github/actions/firebase-web-config
        with:
          project: water-bcb77
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.AUTO_DEPLOY }}
          projectId: water-bcb77
          channelId: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'preview' }}
