name: Deploy production

# Runs on demand, or when a commit on a claude/** branch contains "[deploy prod]".
on:
  workflow_dispatch:
  push:
    branches: [claude/**]

permissions:
  contents: read

env:
  PROJECT: water-bcb77

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy prod]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm ci
        working-directory: functions

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.AUTO_DEPLOY }}

      - name: Firebase web app config
        id: webcfg
        run: |
          set -euo pipefail
          FB="npx -y firebase-tools@latest --project $PROJECT --non-interactive"
          APP_ID=$($FB apps:list WEB --json | node -e "const r=JSON.parse(require('fs').readFileSync(0));console.log((r.result||[])[0]?.appId||'')")
          if [ -z "$APP_ID" ]; then
            APP_ID=$($FB apps:create WEB water-web --json | node -e "const r=JSON.parse(require('fs').readFileSync(0));console.log(r.result.appId)")
            echo "Created web app"
          fi
          $FB apps:sdkconfig WEB "$APP_ID" --json | node -e "
            const c=JSON.parse(require('fs').readFileSync(0)).result.sdkConfig;
            const out=['VITE_FIREBASE_API_KEY='+c.apiKey,'VITE_FIREBASE_AUTH_DOMAIN='+c.authDomain,'VITE_FIREBASE_PROJECT_ID='+c.projectId,
              'VITE_FIREBASE_STORAGE_BUCKET='+(c.storageBucket||''),'VITE_FIREBASE_MESSAGING_SENDER_ID='+(c.messagingSenderId||''),'VITE_FIREBASE_APP_ID='+c.appId];
            require('fs').writeFileSync('.env.production.local', out.join('\n')+'\n');"
          # Web config is public by design (it ships in every page); show it so it can be committed.
          echo '### Web config' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat .env.production.local >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Ensure Firestore database
        id: firestore_db
        continue-on-error: true
        run: |
          FB="npx -y firebase-tools@latest --project $PROJECT --non-interactive"
          if $FB firestore:databases:list --json | grep -q '"(default)"\|databases/(default)'; then
            echo "Firestore (default) exists"
          else
            $FB firestore:databases:create "(default)" --location asia-east1
          fi

      - name: Build site
        run: npm run build

      - name: Deploy hosting (live)
        id: hosting
        continue-on-error: true
        run: npx -y firebase-tools@latest deploy --only hosting --project $PROJECT --non-interactive

      - name: Deploy Firestore rules and indexes
        id: rules_fs
        continue-on-error: true
        run: npx -y firebase-tools@latest deploy --only firestore --project $PROJECT --non-interactive

      - name: Deploy Storage rules
        id: rules_st
        continue-on-error: true
        run: npx -y firebase-tools@latest deploy --only storage --project $PROJECT --non-interactive

      - name: Deploy Cloud Functions
        id: functions
        continue-on-error: true
        run: npx -y firebase-tools@latest deploy --only functions --project $PROJECT --non-interactive --force

      - name: Seed admins and settings
        id: seed
        continue-on-error: true
        env:
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          FIREBASE_PROJECT: ${{ env.PROJECT }}
        run: |
          if [ -z "$ADMIN_EMAILS" ]; then echo "::warning::ADMIN_EMAILS secret is not set"; fi
          node scripts/seed-production.mjs

      - name: Summary
        if: always()
        run: |
          {
            echo '### Deploy results'
            echo '| Step | Result |'
            echo '|---|---|'
            echo "| Firestore database | ${{ steps.firestore_db.outcome }} |"
            echo "| Hosting (https://$PROJECT.web.app) | ${{ steps.hosting.outcome }} |"
            echo "| Firestore rules | ${{ steps.rules_fs.outcome }} |"
            echo "| Storage rules | ${{ steps.rules_st.outcome }} |"
            echo "| Cloud Functions | ${{ steps.functions.outcome }} |"
            echo "| Seed admins/settings | ${{ steps.seed.outcome }} |"
          } >> $GITHUB_STEP_SUMMARY
