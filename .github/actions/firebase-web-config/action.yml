name: Firebase web config
description: Find (or create) the project's Firebase web app and write its public config to .env.production.local
inputs:
  project:
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        PROJECT: ${{ inputs.project }}
      run: |
        set -euo pipefail
        FB="npx -y firebase-tools@latest --project $PROJECT --non-interactive"
        APP_ID=$($FB apps:list WEB --json | node -e "const r=JSON.parse(require('fs').readFileSync(0));console.log((r.result||[])[0]?.appId||'')")
        if [ -z "$APP_ID" ]; then
          APP_ID=$($FB apps:create WEB water-web --json | node -e "const r=JSON.parse(require('fs').readFileSync(0));console.log(r.result.appId)")
        fi
        $FB apps:sdkconfig WEB "$APP_ID" --json | node -e "
          const c=JSON.parse(require('fs').readFileSync(0)).result.sdkConfig;
          const out=['VITE_FIREBASE_API_KEY='+c.apiKey,'VITE_FIREBASE_AUTH_DOMAIN='+c.authDomain,'VITE_FIREBASE_PROJECT_ID='+c.projectId,
            'VITE_FIREBASE_STORAGE_BUCKET='+(c.storageBucket||''),'VITE_FIREBASE_MESSAGING_SENDER_ID='+(c.messagingSenderId||''),'VITE_FIREBASE_APP_ID='+c.appId];
          require('fs').writeFileSync('.env.production.local', out.join('\n')+'\n');
          console.log('web config ready; storage bucket ' + (c.storageBucket ? 'set' : 'NOT set (enable Storage)'));"
